<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="garlandBlushR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9B8C4" />
      <stop offset="60%" stop-color="#C98F9D" />
      <stop offset="100%" stop-color="#F4DCE2" />
    </radialGradient>
    <filter id="garlandShadowR" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-5" dy="8" stdDeviation="8" flood-color="#8B7668" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#garlandShadowR)">
    <!-- Main Thick Vine stem running down the right edge (x=330) -->
    <path d="M330 -50 Q210 200 260 450 T230 850 T320 1250" stroke="#5E705B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M320 -30 Q180 220 240 470 T210 870 T310 1230" stroke="#8B7668" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- LUSH LEAVES EXTENDING INWARD FROM RIGHT EDGE -->
    <!-- Cluster 1 (Top) -->
    <path d="M290 60 C220 30 140 60 160 110 C190 150 270 120 290 60 Z" fill="#5E705B" opacity="0.95"/>
    <path d="M270 110 C190 90 120 130 150 180 C190 210 260 170 270 110 Z" fill="#A8B7A0" opacity="0.9"/>

    <!-- Cluster 2 (Upper-Mid) -->
    <path d="M260 280 C170 240 90 280 120 340 C160 380 240 340 260 280 Z" fill="#A8B7A0" opacity="0.9"/>
    <path d="M250 350 C160 330 80 370 110 430 C150 470 230 420 250 350 Z" fill="#5E705B" opacity="0.95"/>
    <path d="M270 410 C200 390 130 440 170 490 C220 520 280 470 270 410 Z" fill="#A8B7A0" opacity="0.85"/>

    <!-- Cluster 3 (Lower-Mid) -->
    <path d="M240 600 C150 560 70 610 110 670 C150 710 230 670 240 600 Z" fill="#5E705B" opacity="0.9"/>
    <path d="M260 680 C170 650 100 700 140 760 C190 800 260 750 260 680 Z" fill="#A8B7A0" opacity="0.92"/>

    <!-- Cluster 4 (Bottom) -->
    <path d="M270 900 C180 860 110 910 140 970 C190 1010 270 970 270 900 Z" fill="#A8B7A0" opacity="0.9"/>
    <path d="M280 960 C200 940 130 1000 170 1060 C220 1100 280 1040 280 960 Z" fill="#5E705B" opacity="0.95"/>

    <!-- LARGE EMBEDDED FLOWERS ALONG THE GARLAND -->
    <!-- Top Flower -->
    <g transform="translate(240,200)">
      <circle cx="0" cy="0" r="70" fill="url(#garlandBlushR)" />
      <circle cx="10" cy="-10" r="54" fill="#F4DCE2" opacity="0.9" />
      <circle cx="-5" cy="5" r="38" fill="#C98F9D" opacity="0.85" />
      <circle cx="0" cy="0" r="15" fill="#C5A059" />
    </g>

    <!-- Mid Flower -->
    <g transform="translate(210,480)">
      <circle cx="0" cy="0" r="80" fill="#F4DCE2" />
      <circle cx="12" cy="-12" r="62" fill="#E9B8C4" opacity="0.95" />
      <circle cx="-5" cy="5" r="42" fill="#C98F9D" opacity="0.85" />
      <circle cx="0" cy="0" r="18" fill="#C5A059" />
    </g>

    <!-- Lower Flower -->
    <g transform="translate(225,820)">
      <circle cx="0" cy="0" r="72" fill="#E9B8C4" />
      <circle cx="10" cy="-10" r="55" fill="#C98F9D" opacity="0.9" />
      <circle cx="-5" cy="5" r="38" fill="#F4DCE2" />
      <circle cx="0" cy="0" r="16" fill="#C5A059" />
    </g>
  </g>
</svg>
