    <path d="M10 50 C80 20 160 50 140 100 C110 140 30 110 10 50 Z" fill="#A8B7A0" opacity="0.95"/>
    <path d="M30 100 C110 80 180 120 150 170 C110 200 40 160 30 100 Z" fill="#5E705B" opacity="0.9"/>
    <path d="M40 300 C130 260 210 300 180 360 C140 400 60 360 40 300 Z" fill="#5E705B" opacity="0.9"/>
    <path d="M60 620 C150 580 230 630 190 690 C150 730 70 690 60 620 Z" fill="#A8B7A0" opacity="0.9"/>
    <path d="M30 920 C120 880 190 930 160 990 C110 1030 30 990 30 920 Z" fill="#5E705B" opacity="0.9"/>

    <!-- Left Garland Flowers -->
    <g transform="translate(60,180)">
      <circle cx="0" cy="0" r="65" fill="#E9B8C4" />
      <circle cx="-10" cy="-10" r="50" fill="#C98F9D" opacity="0.9" />
      <circle cx="0" cy="0" r="14" fill="#C5A059" />
    </g>
    <g transform="translate(90,520)">
      <circle cx="0" cy="0" r="75" fill="url(#garlandBlushL2)" />
