    <path d="M-30 -50 Q90 200 40 450 T70 850 T-20 1250" stroke="#5E705B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-20 -30 Q120 220 60 470 T90 870 T-10 1230" stroke="#8B7668" stroke-width="3" fill="none" stroke-linecap="round"/>

