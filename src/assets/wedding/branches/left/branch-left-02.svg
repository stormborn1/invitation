      <stop offset="0%" stop-color="#C98F9D" />
      <stop offset="60%" stop-color="#E9B8C4" />
      <stop offset="100%" stop-color="#F4DCE2" />
    </radialGradient>
    <filter id="garlandShadowL2" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="5" dy="8" stdDeviation="8" flood-color="#8B7668" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#garlandShadowL2)">
