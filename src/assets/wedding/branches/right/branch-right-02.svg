    <path d="M290 60 C220 30 140 60 160 110 C190 150 270 120 290 60 Z" fill="#5E705B" opacity="0.95"/>
    <path d="M270 110 C190 90 120 130 150 180 C190 210 260 170 270 110 Z" fill="#A8B7A0" opacity="0.9"/>
    <path d="M260 280 C170 240 90 280 120 340 C160 380 240 340 260 280 Z" fill="#A8B7A0" opacity="0.9"/>
    <path d="M240 600 C150 560 70 610 110 670 C150 710 230 670 240 600 Z" fill="#5E705B" opacity="0.9"/>
    <path d="M270 900 C180 860 110 910 140 970 C190 1010 270 970 270 900 Z" fill="#A8B7A0" opacity="0.9"/>

    <!-- Right Garland Flowers -->
    <g transform="translate(240,200)">
      <circle cx="0" cy="0" r="70" fill="url(#garlandBlushR2)" />
      <circle cx="0" cy="0" r="15" fill="#C5A059" />
    </g>
    <g transform="translate(210,480)">
      <circle cx="0" cy="0" r="80" fill="#F4DCE2" />
