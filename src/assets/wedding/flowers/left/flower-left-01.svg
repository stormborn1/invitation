<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <defs>
    <radialGradient id="roseGradientLeft1" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#F4DCE2" />
      <stop offset="50%" stop-color="#E9B8C4" />
      <stop offset="100%" stop-color="#C98F9D" />
    </radialGradient>
    <filter id="shadowLeft01" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="6" dy="10" stdDeviation="10" flood-color="#5E705B" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadowLeft01)">
    <!-- Foliage backing stem rooted from Left Edge (x=0) -->
    <path d="M-10 180 Q80 160 160 210 T260 250" stroke="#5E705B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M40 170 C90 110 170 120 190 70 C140 60 70 110 40 170 Z" fill="#A8B7A0" opacity="0.95"/>
    <path d="M90 200 C150 220 220 280 250 240 C200 200 130 180 90 200 Z" fill="#5E705B" opacity="0.9"/>
    <path d="M120 150 C190 120 240 160 220 100 C170 80 120 120 120 150 Z" fill="#7A8F76" opacity="0.85"/>

    <!-- Gold Stamens & Buds -->
    <circle cx="210" cy="85" r="7" fill="#C5A059"/>
    <circle cx="230" cy="95" r="5" fill="#E0C078"/>

    <!-- Main Left Rose Bloom -->
    <g transform="translate(130, 160)">
      <!-- Outer Petals -->
      <path d="M-80 -20 C-60 -90 40 -90 60 -30 C90 20 60 80 0 80 C-70 80 -90 30 -80 -20 Z" fill="url(#roseGradientLeft1)"/>
      <path d="M-70 -40 C-20 -100 70 -70 80 -10 C90 50 20 80 -40 70 C-90 60 -90 10 -70 -40 Z" fill="#E9B8C4" opacity="0.9"/>
      <!-- Mid Petals -->
      <path d="M-50 -30 C-10 -70 50 -60 60 -10 C70 40 10 60 -30 50 C-70 40 -70 -10 -50 -30 Z" fill="#F4DCE2" opacity="0.95"/>
      <!-- Inner Core -->
      <circle cx="0" cy="0" r="32" fill="#C98F9D"/>
      <circle cx="-5" cy="-5" r="22" fill="#E9B8C4"/>
      <circle cx="2" cy="2" r="12" fill="#F4DCE2"/>
      <circle cx="0" cy="0" r="6" fill="#C5A059"/>
    </g>

    <!-- Companion Small Bud (Upper Left) -->
    <g transform="translate(60, 80) scale(0.55)">
      <circle cx="0" cy="0" r="40" fill="#E9B8C4"/>
      <circle cx="-5" cy="-5" r="26" fill="#F4DCE2"/>
      <path d="M-30 20 Q-40 -20 0 -35 Q40 -20 30 20 Z" fill="#5E705B" opacity="0.8"/>
    </g>
  </g>
</svg>
