<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <defs>
    <radialGradient id="gardeniaCreamRight1" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#E5D3BD" />
    </radialGradient>
    <filter id="shadowRight01" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-6" dy="10" stdDeviation="10" flood-color="#4A5848" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#shadowRight01)">
    <!-- Foliage stem rooted from RIGHT edge (x=360) extending down-left -->
    <path d="M360 160 Q270 140 180 200 T80 230" stroke="#4A5848" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Deep Green Bay & Laurel leaves reaching left -->
    <path d="M300 140 C240 90 170 110 150 60 C200 50 270 90 300 140 Z" fill="#5E705B" opacity="0.95"/>
    <path d="M250 180 C190 200 120 250 90 210 C140 170 210 160 250 180 Z" fill="#4A5848" opacity="0.9"/>
    <path d="M210 130 C150 100 90 130 110 70 C160 60 200 100 210 130 Z" fill="#8A9A86" opacity="0.85"/>

    <!-- Large Right Cream Gardenia Bloom facing down-left -->
    <g transform="translate(210, 160)">
      <!-- 7 Asymmetric Petals -->
      <path d="M0 0 C-90 -60 -80 30 -10 60 Z" fill="url(#gardeniaCreamRight1)"/>
      <path d="M0 0 C-70 -90 10 -90 40 -30 Z" fill="url(#gardeniaCreamRight1)"/>
      <path d="M0 0 C-20 -100 70 -70 70 -10 Z" fill="url(#gardeniaCreamRight1)"/>
      <path d="M0 0 C40 -60 90 10 60 60 Z" fill="url(#gardeniaCreamRight1)"/>
      <path d="M0 0 C60 20 50 90 -20 80 Z" fill="url(#gardeniaCreamRight1)"/>
      <path d="M0 0 C-40 60 -90 10 -60 -40 Z" fill="url(#gardeniaCreamRight1)"/>

      <!-- Inner Layer Petals -->
      <g transform="scale(0.68) rotate(-20)">
        <path d="M0 0 C-80 -40 -60 40 0 50 Z" fill="#FFFFFF"/>
        <path d="M0 0 C-50 -80 30 -60 40 0 Z" fill="#FDFBF7"/>
        <path d="M0 0 C20 -60 70 0 40 50 Z" fill="#FFFFFF"/>
        <path d="M0 0 C0 60 -70 40 -40 -20 Z" fill="#FDFBF7"/>
      </g>

      <!-- Center Gold Heart -->
      <circle cx="0" cy="0" r="18" fill="#E5D3BD"/>
      <circle cx="0" cy="0" r="10" fill="#C5A059"/>
    </g>
  </g>
</svg>
