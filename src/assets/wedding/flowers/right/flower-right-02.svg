<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <defs>
    <radialGradient id="coralCamelliaRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E9B8C4" />
      <stop offset="65%" stop-color="#D9A2B0" />
      <stop offset="100%" stop-color="#B87383" />
    </radialGradient>
    <filter id="shadowRight02" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-5" dy="9" stdDeviation="8" flood-color="#8B7668" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#shadowRight02)">
    <!-- Delicate Fern Frond sweeping inward from right edge (x=360) -->
    <path d="M360 250 Q280 180 190 140 T40 110" stroke="#7A8F76" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Fern leaflets along stem -->
    <path d="M280 190 L260 160 M260 180 L240 150 M240 170 L220 140 M220 160 L200 130" stroke="#5E705B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Coral Camellia Bloom (Right edge center) -->
    <g transform="translate(190, 180)">
      <!-- Smooth Rounded Petals -->
      <circle cx="0" cy="0" r="85" fill="url(#coralCamelliaRight)"/>
      <circle cx="8" cy="-8" r="68" fill="#E9B8C4" opacity="0.95"/>
      <circle cx="-6" cy="6" r="52" fill="#F4DCE2"/>
      <circle cx="4" cy="-4" r="38" fill="#D9A2B0"/>

      <!-- Golden Stamen Cluster -->
      <g stroke="#C5A059" stroke-width="2">
        <line x1="0" y1="0" x2="-15" y2="-15" /><circle cx="-15" cy="-15" r="3" fill="#E0C078"/>
        <line x1="0" y1="0" x2="15" y2="-12" /><circle cx="15" cy="-12" r="3" fill="#E0C078"/>
        <line x1="0" y1="0" x2="-18" y2="10" /><circle cx="-18" cy="10" r="3" fill="#E0C078"/>
        <line x1="0" y1="0" x2="12" y2="16" /><circle cx="12" cy="16" r="3" fill="#E0C078"/>
        <line x1="0" y1="0" x2="0" y2="-20" /><circle cx="0" cy="-20" r="3.5" fill="#C5A059"/>
      </g>
    </g>

    <!-- Companion Small Bud (Lower Right) -->
    <g transform="translate(290, 240) scale(0.5)">
      <circle cx="0" cy="0" r="42" fill="#D9A2B0"/>
      <circle cx="-4" cy="-4" r="28" fill="#E9B8C4"/>
    </g>
  </g>
</svg>
