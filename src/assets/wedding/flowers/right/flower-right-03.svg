<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 350" width="100%" height="100%">
  <defs>
    <radialGradient id="peonyBlushRight" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F4DCE2" />
      <stop offset="60%" stop-color="#E9B8C4" />
      <stop offset="100%" stop-color="#C98F9D" />
    </radialGradient>
    <filter id="shadowRight03" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-5" dy="8" stdDeviation="7" flood-color="#5E705B" flood-opacity="0.23" />
    </filter>
  </defs>

  <g filter="url(#shadowRight03)">
    <!-- Branch with Olive Leaves coming from right edge (x=360) -->
    <path d="M360 100 Q260 120 170 170 T60 220" stroke="#5E705B" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M280 110 C210 70 150 90 140 50 C180 40 250 70 280 110 Z" fill="#A8B7A0" opacity="0.95"/>
    <path d="M220 140 C150 110 90 140 100 80 C150 70 190 110 220 140 Z" fill="#7A8F76" opacity="0.88"/>

    <!-- Full Open Peony Bloom (Right) -->
    <g transform="translate(190, 170)">
      <!-- Wavy Ruffled Petals -->
      <path d="M-85 -10 C-70 -85 30 -85 75 -20 C90 35 45 85 -15 85 C-75 85 -95 35 -85 -10 Z" fill="url(#peonyBlushRight)"/>
      <path d="M-70 -25 C-45 -95 45 -70 65 -5 C80 45 25 75 -35 65 C-80 50 -85 -5 -70 -25 Z" fill="#F4DCE2" opacity="0.92"/>

      <!-- Inner Layers -->
      <circle cx="0" cy="0" r="45" fill="#E9B8C4"/>
      <circle cx="-5" cy="4" r="32" fill="#F4DCE2"/>
      <circle cx="3" cy="-3" r="20" fill="#C98F9D"/>

      <!-- Yellow-Gold Stamens -->
      <circle cx="0" cy="0" r="10" fill="#C5A059"/>
      <circle cx="0" cy="0" r="5" fill="#FDFBF7"/>
    </g>
  </g>
</svg>
